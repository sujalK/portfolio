<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-label="Inversion of Control and dependency injection code example">
  <defs>
    <pattern id="ioc-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e2e2e2"/>
    </pattern>
    <clipPath id="ioc-panel">
      <rect x="58" y="84" width="790" height="474" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1024" height="640" fill="#faf9f8"/>
  <rect width="1024" height="640" fill="url(#ioc-dots)" opacity=".7"/>
  <rect x="74" y="100" width="790" height="474" rx="20" fill="#111" opacity=".08"/>
  <rect x="58" y="84" width="790" height="474" rx="20" fill="#161616"/>

  <g clip-path="url(#ioc-panel)">
    <rect x="58" y="84" width="790" height="48" fill="#222224"/>
    <rect x="58" y="132" width="54" height="426" fill="#1c1c1e"/>
  </g>
  <circle cx="90" cy="108" r="7" fill="#b91c1c"/>
  <circle cx="114" cy="108" r="7" fill="#6b6b6b"/>
  <circle cx="138" cy="108" r="7" fill="#3f3f42"/>

  <g font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="20">
    <g fill="#5c5c62" text-anchor="end">
      <text x="97" y="190">1</text>
      <text x="97" y="225">2</text>
      <text x="97" y="260">3</text>
      <text x="97" y="295">4</text>
      <text x="97" y="330">5</text>
      <text x="97" y="365">6</text>
      <text x="97" y="400">7</text>
      <text x="97" y="435">8</text>
      <text x="97" y="470">9</text>
      <text x="97" y="505">10</text>
    </g>

    <text x="138" y="190" fill="#8f8f97">&lt;?php</text>
    <text x="138" y="250" fill="#6f7a6f">// The container supplies the dependency</text>
    <text x="138" y="295"><tspan fill="#ef4444">final class&#160;</tspan><tspan fill="#f4f4f5">UserController</tspan></text>
    <text x="138" y="330" fill="#e4e4e7">{</text>
    <text x="138" y="365"><tspan fill="#ef4444">&#160;&#160;&#160;&#160;public function&#160;</tspan><tspan fill="#f4f4f5">__construct</tspan><tspan fill="#9c9ca4">(</tspan></text>
    <text x="138" y="400"><tspan fill="#ef4444">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;private readonly&#160;</tspan></text>
    <text x="138" y="435"><tspan fill="#f4f4f5">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;UserRepository&#160;</tspan><tspan fill="#e4e4e7">$users</tspan></text>
    <text x="138" y="470"><tspan fill="#9c9ca4">&#160;&#160;&#160;&#160;)&#160;</tspan><tspan fill="#e4e4e7">{}</tspan></text>
    <text x="138" y="505" fill="#e4e4e7">}</text>
  </g>

  <g transform="translate(748 150)" font-family="Arial, Helvetica, sans-serif">
    <rect width="170" height="94" rx="16" fill="#b91c1c"/>
    <text x="85" y="40" text-anchor="middle" fill="#fee2e2" font-size="15" font-weight="700">DESIGN PRINCIPLE</text>
    <text x="85" y="71" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">IoC</text>
  </g>

  <g transform="translate(772 286)" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect width="124" height="110" rx="14" fill="#232326"/>
    <text x="62" y="35" text-anchor="middle" fill="#8f8f97" font-size="12" font-weight="700">CONTAINER</text>
    <circle cx="62" cy="66" r="18" fill="none" stroke="#ef4444" stroke-width="3"/>
    <path d="M62 46v40M42 66h40" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="101" text-anchor="middle" fill="#fff" font-size="11">creates + injects</text>
  </g>
</svg>
