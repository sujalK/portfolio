<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-label="PHP 8.4 Asymmetric visibility code example">
  <defs>
    <pattern id="asym-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e2e2e2"/>
    </pattern>
    <clipPath id="asym-panel">
      <rect x="58" y="84" width="790" height="474" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1024" height="640" fill="#faf9f8"/>
  <rect width="1024" height="640" fill="url(#asym-dots)" opacity=".7"/>
  <rect x="74" y="100" width="790" height="474" rx="20" fill="#111" opacity=".08"/>
  <rect x="58" y="84" width="790" height="474" rx="20" fill="#161616"/>

  <g clip-path="url(#asym-panel)">
    <rect x="58" y="84" width="790" height="48" fill="#222224"/>
    <rect x="58" y="132" width="54" height="426" fill="#1c1c1e"/>
  </g>
  <circle cx="90" cy="108" r="7" fill="#b91c1c"/>
  <circle cx="114" cy="108" r="7" fill="#6b6b6b"/>
  <circle cx="138" cy="108" r="7" fill="#3f3f42"/>

  <g font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="20">
    <g fill="#5c5c62" text-anchor="end">
      <text x="97" y="190">1</text>
      <text x="97" y="225">2</text>
      <text x="97" y="260">3</text>
      <text x="97" y="295">4</text>
      <text x="97" y="330">5</text>
      <text x="97" y="365">6</text>
      <text x="97" y="400">7</text>
      <text x="97" y="435">8</text>
      <text x="97" y="470">9</text>
      <text x="97" y="505">10</text>
    </g>

    <text x="138" y="190" fill="#8f8f97">&lt;?php</text>
    <text x="138" y="250" fill="#6f7a6f">// Public read, private write</text>
    <text x="138" y="295"><tspan fill="#ef4444">class&#160;</tspan><tspan fill="#f4f4f5">Article</tspan><tspan fill="#e4e4e7">&#160;{</tspan></text>
    <text x="138" y="340"><tspan fill="#ef4444">&#160;&#160;&#160;&#160;public&#160;private(set)&#160;</tspan><tspan fill="#f4f4f5">string&#160;</tspan><tspan fill="#e4e4e7">$title;</tspan></text>
    <text x="138" y="385"><tspan fill="#ef4444">&#160;&#160;&#160;&#160;public&#160;function&#160;</tspan><tspan fill="#f4f4f5">rename</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#f4f4f5">string&#160;</tspan><tspan fill="#e4e4e7">$title</tspan><tspan fill="#9c9ca4">):&#160;</tspan><tspan fill="#f4f4f5">void</tspan></text>
    <text x="138" y="420"><tspan fill="#e4e4e7">&#160;&#160;&#160;&#160;{</tspan></text>
    <text x="138" y="455"><tspan fill="#e4e4e7">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;$this-&gt;title&#160;=&#160;$title;</tspan></text>
    <text x="138" y="490"><tspan fill="#e4e4e7">&#160;&#160;&#160;&#160;}</tspan></text>
    <text x="138" y="525" fill="#e4e4e7">}</text>
  </g>

  <g transform="translate(748 150)" font-family="Arial, Helvetica, sans-serif">
    <rect width="170" height="94" rx="16" fill="#b91c1c"/>
    <text x="85" y="40" text-anchor="middle" fill="#fee2e2" font-size="15" font-weight="700">PHP 8.4</text>
    <text x="85" y="69" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Visibility</text>
  </g>
  <g transform="translate(772 286)" font-family="'SFMono-Regular', Menlo, monospace">
    <rect width="124" height="110" rx="14" fill="#232326"/>
    <text x="62" y="42" text-anchor="middle" fill="#fff" font-size="15">public</text>
    <text x="62" y="72" text-anchor="middle" fill="#ef4444" font-size="14">private(set)</text>
    <text x="62" y="96" text-anchor="middle" fill="#8f8f97" font-size="12">read / write</text>
  </g>
</svg>
