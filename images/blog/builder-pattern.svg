<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-label="Builder pattern fluent chained methods in PHP">
    <defs>
        <pattern id="builder-dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#e2e2e2" />
        </pattern>
        <clipPath id="builder-panel-clip">
            <rect x="64" y="112" width="768" height="440" rx="18" />
        </clipPath>
    </defs>

    <rect width="1024" height="640" fill="#faf9f8" />
    <rect width="1024" height="640" fill="url(#builder-dots)" opacity=".7" />

    <g fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" opacity=".5">
        <path d="M176 74h40M196 54v40" />
    </g>
    <circle cx="924" cy="98" r="32" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="5 6" />

    <rect x="80" y="128" width="768" height="440" rx="18" fill="#0f0f10" opacity=".08" />
    <rect x="64" y="112" width="768" height="440" rx="18" fill="#161616" />

    <g clip-path="url(#builder-panel-clip)">
        <rect x="64" y="112" width="768" height="46" fill="#1f1f21" />
        <circle cx="94" cy="135" r="7" fill="#b91c1c" />
        <circle cx="118" cy="135" r="7" fill="#6b6b6b" />
        <circle cx="142" cy="135" r="7" fill="#3f3f42" />
        <rect x="64" y="158" width="52" height="394" fill="#1b1b1d" />
    </g>

    <g font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing=".2">
        <g fill="#5c5c62" text-anchor="end">
            <text x="100" y="208">1</text>
            <text x="100" y="240">2</text>
            <text x="100" y="272">3</text>
            <text x="100" y="304">4</text>
            <text x="100" y="336">5</text>
            <text x="100" y="368">6</text>
            <text x="100" y="400">7</text>
            <text x="100" y="432">8</text>
            <text x="100" y="464">9</text>
            <text x="100" y="496">10</text>
        </g>

        <text x="140" y="208" fill="#8f8f97">&lt;?php</text>

        <text x="140" y="272" fill="#6f7a6f">// Factory hands back a configured builder</text>

        <text x="140" y="304"><tspan fill="#e4e4e7">$email&#160;</tspan><tspan fill="#9c9ca4">=&#160;</tspan><tspan fill="#e4e4e7">$emailFactory</tspan><tspan fill="#9c9ca4">-&gt;</tspan><tspan fill="#f4f4f5">builder</tspan><tspan fill="#9c9ca4">()</tspan></text>
        <text x="140" y="336"><tspan fill="#9c9ca4">&#160;&#160;&#160;&#160;-&gt;</tspan><tspan fill="#f4f4f5">to</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">'dev@example.com'</tspan><tspan fill="#9c9ca4">)</tspan></text>
        <text x="140" y="368"><tspan fill="#9c9ca4">&#160;&#160;&#160;&#160;-&gt;</tspan><tspan fill="#f4f4f5">subject</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">'Welcome aboard'</tspan><tspan fill="#9c9ca4">)</tspan></text>
        <text x="140" y="400"><tspan fill="#9c9ca4">&#160;&#160;&#160;&#160;-&gt;</tspan><tspan fill="#f4f4f5">body</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">'Thanks for joining'</tspan><tspan fill="#9c9ca4">)</tspan></text>
        <text x="140" y="432"><tspan fill="#9c9ca4">&#160;&#160;&#160;&#160;-&gt;</tspan><tspan fill="#ef4444">build</tspan><tspan fill="#9c9ca4">();</tspan></text>

        <text x="140" y="496" fill="#6f7a6f">// One readable, step by step object</text>
    </g>

    <g transform="translate(736 150)">
        <rect width="164" height="72" rx="14" fill="#b91c1c" />
        <text x="82" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Builder</text>
    </g>

    <g transform="translate(760 254)" fill="#232326">
        <rect width="116" height="26" rx="7" />
        <rect y="36" width="116" height="26" rx="7" opacity=".82" />
        <rect y="72" width="116" height="26" rx="7" opacity=".64" />
        <rect y="108" width="116" height="26" rx="7" opacity=".46" />
    </g>

    <g transform="translate(700 412)">
        <circle cx="52" cy="52" r="52" fill="#faf9f8" stroke="#b91c1c" stroke-width="2" />
        <g fill="none" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 62h44" />
            <path d="M38 62V44h12v18M56 62V34h12v28" />
        </g>
