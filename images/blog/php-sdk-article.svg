<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-label="PHP SDK pipeline from developer call to ApiData objects">
  <defs>
    <pattern id="sdk-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e2e2e2"/>
    </pattern>
    <clipPath id="sdk-panel-clip">
      <rect x="58" y="96" width="520" height="448" rx="20"/>
    </clipPath>
    <linearGradient id="sdk-pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="640" fill="#faf9f8"/>
  <rect width="1024" height="640" fill="url(#sdk-dots)" opacity=".7"/>

  <g fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" opacity=".45">
    <path d="M168 68h36M186 50v36"/>
  </g>
  <circle cx="928" cy="88" r="30" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="5 6"/>

  <rect x="72" y="112" width="520" height="448" rx="20" fill="#0f0f10" opacity=".08"/>
  <rect x="58" y="96" width="520" height="448" rx="20" fill="#161616"/>

  <g clip-path="url(#sdk-panel-clip)">
    <rect x="58" y="96" width="520" height="46" fill="#1f1f21"/>
    <circle cx="88" cy="119" r="7" fill="#b91c1c"/>
    <circle cx="112" cy="119" r="7" fill="#6b6b6b"/>
    <circle cx="136" cy="119" r="7" fill="#3f3f42"/>
    <rect x="58" y="142" width="48" height="402" fill="#1b1b1d"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing=".15">
    <g fill="#5c5c62" text-anchor="end">
      <text x="96" y="188">1</text>
      <text x="96" y="218">2</text>
      <text x="96" y="248">3</text>
      <text x="96" y="278">4</text>
      <text x="96" y="308">5</text>
      <text x="96" y="338">6</text>
      <text x="96" y="368">7</text>
      <text x="96" y="398">8</text>
      <text x="96" y="428">9</text>
      <text x="96" y="458">10</text>
      <text x="96" y="488">11</text>
    </g>

    <text x="128" y="188" fill="#8f8f97">&lt;?php</text>
    <text x="128" y="248" fill="#6f7a6f">// What the SDK consumer writes</text>
    <text x="128" y="278"><tspan fill="#e4e4e7">$client </tspan><tspan fill="#9c9ca4">= new </tspan><tspan fill="#f4f4f5">ApiClient</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#e4e4e7">$apiKey</tspan><tspan fill="#9c9ca4">);</tspan></text>
    <text x="128" y="338"><tspan fill="#e4e4e7">$results </tspan><tspan fill="#9c9ca4">= </tspan><tspan fill="#e4e4e7">$client</tspan><tspan fill="#9c9ca4">-&gt;</tspan><tspan fill="#ef4444">search</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">query:</tspan><tspan fill="#9c9ca4"> </tspan><tspan fill="#d1b06b">'robot'</tspan><tspan fill="#9c9ca4">);</tspan></text>
    <text x="128" y="398" fill="#6f7a6f">// Returns friendly ApiData objects</text>
    <text x="128" y="428"><tspan fill="#9c9ca4">foreach (</tspan><tspan fill="#e4e4e7">$results</tspan><tspan fill="#9c9ca4"> as </tspan><tspan fill="#e4e4e7">$item</tspan><tspan fill="#9c9ca4">) {</tspan></text>
    <text x="128" y="458"><tspan fill="#9c9ca4">    echo </tspan><tspan fill="#e4e4e7">$item</tspan><tspan fill="#9c9ca4">-&gt;</tspan><tspan fill="#f4f4f5">title</tspan><tspan fill="#9c9ca4">;</tspan></text>
    <text x="128" y="488" fill="#e4e4e7">}</text>
  </g>

  <g transform="translate(430, 130)" font-family="system-ui, sans-serif">
    <rect width="132" height="58" rx="14" fill="#b91c1c"/>
    <text x="66" y="26" text-anchor="middle" fill="#fee2e2" font-size="11" font-weight="700" letter-spacing="1.2">LINKEDIN ARTICLE</text>
    <text x="66" y="46" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">PHP SDK</text>
  </g>

  <g transform="translate(612, 108)" font-family="system-ui, sans-serif">
    <text x="0" y="0" fill="#6b7280" font-size="13" font-weight="700" letter-spacing="1.3">UNDER THE HOOD</text>
    <text x="0" y="28" fill="#111827" font-size="22" font-weight="800">Request &#8594; response &#8594; DTO</text>

    <g transform="translate(0, 52)">
      <rect width="168" height="52" rx="12" fill="#232326"/>
      <text x="84" y="22" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="700">STEP 1</text>
      <text x="84" y="40" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">buildQuery()</text>

      <path d="M84 52v22" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="84,82 78,72 90,72" fill="#b91c1c"/>

      <g transform="translate(0, 88)">
        <rect width="168" height="52" rx="12" fill="#232326"/>
        <text x="84" y="22" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="700">STEP 2</text>
        <text x="84" y="40" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">request() / cURL</text>
      </g>

      <path d="M84 140v22" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="84,170 78,160 90,160" fill="#b91c1c"/>

      <g transform="translate(0, 176)">
        <rect width="168" height="52" rx="12" fill="#232326"/>
        <text x="84" y="22" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="700">STEP 3</text>
        <text x="84" y="40" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">decodeResponse()</text>
      </g>

      <path d="M84 228v22" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="84,258 78,248 90,248" fill="#b91c1c"/>

      <g transform="translate(0, 264)">
        <rect width="168" height="52" rx="12" fill="#232326"/>
        <text x="84" y="22" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="700">STEP 4</text>
        <text x="84" y="40" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">formatResult()</text>
      </g>
    </g>

    <g transform="translate(188, 88)">
      <rect width="92" height="36" rx="10" fill="#faf9f8" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="46" y="23" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="700">HTTP</text>
      <rect y="48" width="92" height="36" rx="10" fill="#faf9f8" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="46" y="71" text-anchor="middle" fill="#374151" font-size="12" font-weight="700">JSON</text>
      <rect y="96" width="92" height="36" rx="10" fill="#faf9f8" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="46" y="119" text-anchor="middle" fill="#374151" font-size="11" font-weight="700">.env key</text>
    </g>
  </g>

  <g transform="translate(820, 168)" font-family="system-ui, sans-serif">
    <rect width="168" height="108" rx="16" fill="#b91c1c"/>
    <text x="84" y="32" text-anchor="middle" fill="#fee2e2" font-size="11" font-weight="700" letter-spacing="1">DEVELOPER-FACING</text>
    <text x="84" y="58" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">ApiData</text>
    <text x="84" y="82" text-anchor="middle" fill="#fecaca" font-size="12">title &#183; link &#183; description</text>

    <g transform="translate(0, 128)" opacity=".92">
      <rect width="168" height="34" rx="9" fill="#232326"/>
      <rect x="12" y="12" width="72" height="8" rx="4" fill="#6b7280"/>
      <rect x="12" y="24" width="110" height="6" rx="3" fill="#4b5563"/>
    </g>
    <g transform="translate(0, 172)" opacity=".75">
      <rect width="168" height="34" rx="9" fill="#232326"/>
      <rect x="12" y="12" width="64" height="8" rx="4" fill="#6b7280"/>
      <rect x="12" y="24" width="98" height="6" rx="3" fill="#4b5563"/>
    </g>
    <g transform="translate(0, 216)" opacity=".58">
      <rect width="168" height="34" rx="9" fill="#232326"/>
      <rect x="12" y="12" width="80" height="8" rx="4" fill="#6b7280"/>
      <rect x="12" y="24" width="104" height="6" rx="3" fill="#4b5563"/>
    </g>
  </g>

  <path d="M780 340 C810 340, 800 260, 820 248" fill="none" stroke="url(#sdk-pipe)" stroke-width="3" stroke-linecap="round"/>
  <path d="M548 360 C620 360, 700 340, 748 340" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5" opacity=".55"/>

  <g transform="translate(612, 548)" font-family="system-ui, sans-serif">
    <rect width="376" height="44" rx="22" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="188" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">One simple call &#183; predictable objects &#183; safer integration</text>
  </g>
</svg>
