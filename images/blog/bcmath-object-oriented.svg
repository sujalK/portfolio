<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-label="PHP 8.4 BcMath Number object code illustration">
    <defs>
        <pattern id="bcmath-dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#e2e2e2" />
        </pattern>
        <clipPath id="bcmath-panel-clip">
            <rect x="64" y="112" width="768" height="440" rx="18" />
        </clipPath>
    </defs>

    <rect width="1024" height="640" fill="#faf9f8" />
    <rect x="0" y="0" width="1024" height="640" fill="url(#bcmath-dots)" opacity=".7" />

    <g fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" opacity=".55">
        <path d="M212 60h34M229 43v34" />
        <path d="M896 556h34" />
    </g>
    <g fill="#8c8c8c" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="34" opacity=".65">
        <text x="936" y="182">&#247;</text>
        <text x="52" y="596">&#215;</text>
        <text x="936" y="606">&#8722;</text>
    </g>
    <circle cx="932" cy="88" r="38" fill="none" stroke="#b91c1c" stroke-width="2" opacity=".35" />
    <circle cx="88" cy="600" r="26" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 7" />

    <rect x="80" y="128" width="768" height="440" rx="18" fill="#0f0f10" opacity=".08" />
    <rect x="64" y="112" width="768" height="440" rx="18" fill="#161616" />

    <g clip-path="url(#bcmath-panel-clip)">
        <rect x="64" y="112" width="768" height="46" fill="#1f1f21" />
        <circle cx="94" cy="135" r="7" fill="#b91c1c" />
        <circle cx="118" cy="135" r="7" fill="#6b6b6b" />
        <circle cx="142" cy="135" r="7" fill="#3f3f42" />
        <rect x="64" y="158" width="52" height="394" fill="#1b1b1d" />
    </g>

    <g font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing=".2">
        <g fill="#5c5c62" text-anchor="end">
            <text x="100" y="208">1</text>
            <text x="100" y="240">2</text>
            <text x="100" y="272">3</text>
            <text x="100" y="304">4</text>
            <text x="100" y="336">5</text>
            <text x="100" y="368">6</text>
            <text x="100" y="400">7</text>
            <text x="100" y="432">8</text>
            <text x="100" y="464">9</text>
            <text x="100" y="496">10</text>
        </g>

        <text x="140" y="208" fill="#8f8f97">&lt;?php</text>

        <text x="140" y="272" fill="#6f7a6f">// Initializes a new precise number object</text>

        <text x="140" y="304"><tspan fill="#e4e4e7">$number1&#160;</tspan><tspan fill="#9c9ca4">=&#160;</tspan><tspan fill="#ef4444">new&#160;</tspan><tspan fill="#f4f4f5">BcMath\Number</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">'10.50'</tspan><tspan fill="#9c9ca4">);</tspan></text>

        <text x="140" y="336"><tspan fill="#e4e4e7">$number2&#160;</tspan><tspan fill="#9c9ca4">=&#160;</tspan><tspan fill="#ef4444">new&#160;</tspan><tspan fill="#f4f4f5">BcMath\Number</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">'5.25'</tspan><tspan fill="#9c9ca4">);</tspan></text>

        <text x="140" y="400" fill="#6f7a6f">// Operators instead of bcadd() / bcsub()</text>

        <text x="140" y="432"><tspan fill="#e4e4e7">$sum&#160;&#160;</tspan><tspan fill="#9c9ca4">=&#160;</tspan><tspan fill="#e4e4e7">$number1&#160;</tspan><tspan fill="#ef4444">+&#160;</tspan><tspan fill="#e4e4e7">$number2;</tspan></text>

        <text x="140" y="464"><tspan fill="#e4e4e7">$diff&#160;</tspan><tspan fill="#9c9ca4">=&#160;</tspan><tspan fill="#e4e4e7">$number1&#160;</tspan><tspan fill="#ef4444">-&#160;</tspan><tspan fill="#e4e4e7">$number2;</tspan></text>

        <text x="140" y="496"><tspan fill="#e4e4e7">$prod&#160;</tspan><tspan fill="#9c9ca4">=&#160;</tspan><tspan fill="#e4e4e7">$number1&#160;</tspan><tspan fill="#ef4444">*&#160;</tspan><tspan fill="#e4e4e7">$number2;</tspan></text>
    </g>

    <g transform="translate(742 148)">
        <rect x="0" y="0" width="150" height="106" rx="16" fill="#b91c1c" />
        <text x="75" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="46" font-weight="800" fill="#ffffff">8.4</text>
    </g>

    <g transform="translate(766 286)">
        <rect x="0" y="0" width="132" height="112" rx="14" fill="#232326" />
        <text x="66" y="72" text-anchor="middle" font-family="'SFMono-Regular', Menlo, monospace" font-size="44" fill="#ffffff">{ }</text>
    </g>

    <g transform="translate(700 402)">
        <circle cx="52" cy="52" r="52" fill="#faf9f8" stroke="#b91c1c" stroke-width="2" />
        <g fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linejoin="round">
            <path d="M52 22 78 36v32L52 82 26 68V36z" />
            <path d="M52 22v22M52 44 26 36M52 44l26-8M52 44v38" />
        </g>
    </g>
</svg>
