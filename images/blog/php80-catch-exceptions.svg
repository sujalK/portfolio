<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-label="PHP 8.0 catch without unused exception variable">
    <defs>
        <pattern id="php80-dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#e2e2e2" />
        </pattern>
        <clipPath id="php80-panel-clip">
            <rect x="64" y="112" width="768" height="440" rx="18" />
        </clipPath>
    </defs>

    <rect width="1024" height="640" fill="#faf9f8" />
    <rect width="1024" height="640" fill="url(#php80-dots)" opacity=".7" />

    <g fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" opacity=".5">
        <path d="M180 72h40M200 52v40" />
    </g>
    <circle cx="920" cy="96" r="34" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="5 6" />
    <text x="72" y="580" fill="#8c8c8c" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="28" opacity=".55">8.0</text>

    <rect x="80" y="128" width="768" height="440" rx="18" fill="#0f0f10" opacity=".08" />
    <rect x="64" y="112" width="768" height="440" rx="18" fill="#161616" />

    <g clip-path="url(#php80-panel-clip)">
        <rect x="64" y="112" width="768" height="46" fill="#1f1f21" />
        <circle cx="94" cy="135" r="7" fill="#b91c1c" />
        <circle cx="118" cy="135" r="7" fill="#6b6b6b" />
        <circle cx="142" cy="135" r="7" fill="#3f3f42" />
        <rect x="64" y="158" width="52" height="394" fill="#1b1b1d" />
    </g>

    <g font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing=".2">
        <g fill="#5c5c62" text-anchor="end">
            <text x="100" y="208">1</text>
            <text x="100" y="240">2</text>
            <text x="100" y="272">3</text>
            <text x="100" y="304">4</text>
            <text x="100" y="336">5</text>
            <text x="100" y="368">6</text>
            <text x="100" y="400">7</text>
            <text x="100" y="432">8</text>
            <text x="100" y="464">9</text>
            <text x="100" y="496">10</text>
        </g>

        <text x="140" y="208" fill="#8f8f97">&lt;?php</text>

        <text x="140" y="272" fill="#6f7a6f">// PHP 8.0+: catch without unused $e</text>

        <text x="140" y="304"><tspan fill="#ef4444">try </tspan><tspan fill="#e4e4e7">{</tspan></text>
        <text x="140" y="336"><tspan fill="#e4e4e7">&#160;&#160;&#160;&#160;throw&#160;</tspan><tspan fill="#ef4444">new&#160;</tspan><tspan fill="#f4f4f5">Exception</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#d1b06b">'Oops'</tspan><tspan fill="#9c9ca4">);</tspan></text>
        <text x="140" y="368"><tspan fill="#e4e4e7">}&#160;</tspan><tspan fill="#ef4444">catch&#160;</tspan><tspan fill="#9c9ca4">(</tspan><tspan fill="#f4f4f5">Exception</tspan><tspan fill="#9c9ca4">)&#160;</tspan><tspan fill="#e4e4e7">{</tspan></text>
        <text x="140" y="400" fill="#6f7a6f">&#160;&#160;&#160;&#160;// no $exception needed</text>
        <text x="140" y="432"><tspan fill="#e4e4e7">&#160;&#160;&#160;&#160;echo&#160;</tspan><tspan fill="#d1b06b">'Handled safely'</tspan><tspan fill="#9c9ca4">;</tspan></text>
        <text x="140" y="464" fill="#e4e4e7">}</text>
    </g>

    <g transform="translate(742 148)">
        <rect width="150" height="106" rx="16" fill="#b91c1c" />
        <text x="75" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="46" font-weight="800" fill="#ffffff">8.0</text>
    </g>

    <g transform="translate(766 286)">
        <rect width="132" height="112" rx="14" fill="#232326" />
        <text x="66" y="68" text-anchor="middle" font-family="'SFMono-Regular', Menlo, monospace" font-size="36" fill="#ffffff">try</text>
    </g>

    <g transform="translate(700 402)">
        <circle cx="52" cy="52" r="52" fill="#faf9f8" stroke="#b91c1c" stroke-width="2" />
        <g fill="none" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 52h40" />
            <path d="M58 36l16 16-16 16" />
        </g>
    </g>
</svg>
