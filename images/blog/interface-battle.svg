<svg width="520" height="420" viewBox="0 0 520 420" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <rect width="520" height="420" fill="#F7F7F8"/>
    <rect x="28" y="36" width="464" height="348" rx="20" fill="#FFFFFF" stroke="#ECECEC"/>

    <!-- soft floor shadow -->
    <ellipse cx="360" cy="330" rx="78" ry="16" fill="#E8E8EA"/>

    <!-- left: PHP interface card -->
    <rect x="52" y="72" width="188" height="236" rx="16" fill="#161616"/>
    <text x="72" y="108" fill="#FCA5A5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">interface</text>
    <text x="72" y="138" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Payable</text>
    <rect x="72" y="156" width="100" height="3" rx="1.5" fill="#B91C1C"/>
    <text x="72" y="192" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="12">+ pay()</text>
    <text x="72" y="218" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="12">+ refund()</text>
    <text x="72" y="244" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="12">+ status()</text>
    <rect x="72" y="268" width="128" height="26" rx="8" fill="#B91C1C"/>
    <text x="92" y="285" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">contract</text>

    <!-- VS -->
    <circle cx="268" cy="190" r="26" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
    <text x="252" y="197" fill="#991B1B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">VS</text>

    <!-- cartoon fighter carrying a sword -->
    <g transform="translate(300, 70)">
        <!-- legs -->
        <path d="M48 230c-2 28-8 52-10 70" stroke="#161616" stroke-width="14" stroke-linecap="round"/>
        <path d="M82 230c2 28 8 52 12 70" stroke="#161616" stroke-width="14" stroke-linecap="round"/>
        <!-- boots -->
        <ellipse cx="36" cy="302" rx="18" ry="8" fill="#B91C1C"/>
        <ellipse cx="98" cy="302" rx="18" ry="8" fill="#B91C1C"/>

        <!-- body -->
        <rect x="38" y="140" width="54" height="92" rx="22" fill="#161616"/>
        <!-- belt -->
        <rect x="40" y="198" width="50" height="12" rx="4" fill="#B91C1C"/>
        <circle cx="65" cy="204" r="5" fill="#FCA5A5"/>

        <!-- left arm holding sword up -->
        <path d="M42 160c-18 4-30 0-38-18" stroke="#161616" stroke-width="12" stroke-linecap="round"/>
        <!-- sword -->
        <g transform="translate(-18, 78) rotate(-28)">
            <rect x="0" y="0" width="12" height="34" rx="3" fill="#7C2D12"/>
            <rect x="-10" y="28" width="32" height="8" rx="3" fill="#B91C1C"/>
            <path d="M6 34 L6 118 C6 126 0 130 6 136 C12 130 6 126 6 118 Z" fill="#D4D4D8"/>
            <path d="M6 34 L6 118" stroke="#FAFAFA" stroke-width="2"/>
        </g>
        <!-- glove -->
        <circle cx="4" cy="138" r="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/>

        <!-- right arm flexed -->
        <path d="M88 164c18 2 28 14 26 34" stroke="#161616" stroke-width="12" stroke-linecap="round"/>
        <circle cx="112" cy="198" r="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/>

        <!-- head -->
        <circle cx="65" cy="108" r="34" fill="#F5D0B5"/>
        <!-- hair -->
        <path d="M36 100c4-28 22-42 50-40 8 18 6 34 2 44-16-8-34-8-52-4Z" fill="#161616"/>
        <!-- eyes -->
        <circle cx="54" cy="110" r="4" fill="#161616"/>
        <circle cx="76" cy="110" r="4" fill="#161616"/>
        <!-- determined brows -->
        <path d="M46 100c8 2 14 2 18-2" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
        <path d="M70 98c8 4 14 4 20 0" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
        <!-- smile -->
        <path d="M56 124c6 8 14 8 20 0" stroke="#161616" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- headband -->
        <rect x="38" y="90" width="54" height="10" rx="4" fill="#B91C1C"/>
        <text x="48" y="98" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="800">PHP</text>
    </g>

    <text x="52" y="350" fill="#6B6B6B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">PHP Interfaces &amp; my battle</text>
</svg>
